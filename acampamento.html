<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Desindexação pelo Google e buscadores -->
  <meta name="robots" content="noindex, follow">
  
  <title>Redirecionando - Acampamento Paróquia São Francisco de Assis</title>
  
  <!-- Redirecionamento Imediato via Meta Refresh -->
  <meta http-equiv="refresh" content="0; url=https://acampamentoguaratuba.com.br/">
  <link rel="canonical" href="https://acampamentoguaratuba.com.br/">

  <!-- Redirecionamento Imediato via JavaScript -->
  <script>
    window.location.replace("https://acampamentoguaratuba.com.br/");
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #f1f5f9;
    }
    p {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      background: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    a.btn:hover {
      background: #2563eb;
    }
    .spinner {
      margin: 0 auto 20px auto;
      width: 40px;
      height: 40px;
      border: 3px solid #334155;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecionando...</h1>
    <p>O site do Acampamento agora tem um endereço próprio oficial. Você está sendo redirecionado automaticamente.</p>
    <a class="btn" href="https://acampamentoguaratuba.com.br/">Acessar o Novo Site</a>
  </div>
</body>
</html>
